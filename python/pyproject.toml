[project]
name = "atlas-agente"
version = "0.2.0"
description = "Agente autônomo LangGraph + MCP Server para dados educacionais do Atlas Escolar"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "mcp>=2.2,<3",
    "pydantic>=2.13,<3",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.54,<1",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
